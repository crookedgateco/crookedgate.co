<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Quick Ones | Crooked Gate Seasonings
  </title>

  <link
    rel="stylesheet"
    href="/style.css"
  >

  <style>

    .coming-soon-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      box-sizing: border-box;
      background: #f2eadc;
      color: #17140f;
      text-align: center;
    }

    .coming-soon-inner {
      width: min(700px, 100%);
    }

    .coming-soon-kicker {
      margin-bottom: 14px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 0.85rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .coming-soon-title {
      margin: 0 0 20px;
      font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
      font-size: clamp(4rem, 18vw, 8rem);
      line-height: 0.9;
      text-transform: uppercase;
    }

    .coming-soon-copy {
      margin: 0 auto 28px;
      max-width: 560px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.1rem;
      line-height: 1.6;
    }

    .coming-soon-link {
      display: inline-block;
      padding: 15px 20px;
      border: 2px solid #17140f;
      background: #17140f;
      color: #f2eadc;
      text-decoration: none;
      font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
      font-size: 1rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

  </style>
</head>

<body>

  <main
    class="coming-soon-page"
  >

    <div
      class="coming-soon-inner"
    >

      <div
        class="coming-soon-kicker"
      >
        Crooked Gate Seasonings
      </div>


      <h1
        class="coming-soon-title"
      >
        Quick Ones
      </h1>


      <p
        class="coming-soon-copy"
      >
        Fast meals for the nights dinner needed to happen ten minutes ago. Quick Ones are coming soon.
      </p>


      <a
        class="coming-soon-link"
        href="/"
      >
        Back to Crooked Gate →
      </a>

    </div>

  </main>

</body>

</html>
